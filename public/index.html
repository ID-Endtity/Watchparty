<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watchparty</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Watchparty</h1>

      <section id="join-screen" class="screen">
        <button id="create-btn" class="primary full">Create room</button>
        <p class="hint">Creates a private room and gives you a code to share.</p>

        <hr class="divider" />

        <label for="room-code">Join with a code</label>
        <div class="join-row">
          <input id="room-code" maxlength="12" placeholder="e.g. K7MN2PQR" autocomplete="off" />
          <button id="join-btn">Join</button>
        </div>
        <p id="join-error" class="error"></p>
      </section>

      <section id="room-screen" class="screen hidden">
        <div class="room-header">
          <div class="room-code">
            <span>Room <strong id="room-label"></strong></span>
            <button id="copy-btn" class="small">Copy</button>
          </div>
          <span id="stream-status" class="status">No stream yet</span>
        </div>

        <p class="hint">Share this code with friends so they can join.</p>

        <div class="controls">
          <button id="share-btn" class="primary">Share screen</button>
          <button id="stop-btn" class="hidden">Stop sharing</button>
        </div>

        <div id="stream-area" class="stream-area hidden">
          <video id="remote-video" autoplay playsinline></video>
          <video id="local-preview" autoplay playsinline muted></video>
        </div>

        <h2>In this room</h2>
        <ul id="peers" class="peers"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
